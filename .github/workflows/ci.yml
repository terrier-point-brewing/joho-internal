name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Search/filter standard
        run: npm run check:search-filter -- --strict

      # Guards the scope registry: no retired requireRole, no legacy role
      # comparisons outside lib/auth, no capability without a consumer, no
      # scope without a capability, no client module value-importing the
      # server-reaching @/lib/auth barrel.
      - name: Permission model standard
        run: npm run check:permissions

      # The Marketing boundary. Marketing is the one section in this app with
      # an enforced seam — nothing outside it may import it, and it may reach
      # only shared infrastructure — because it is built to be replaced,
      # extracted, or pointed at a different set of integrations. A guard that
      # runs only when somebody remembers `npm run verify` is not a seam, so it
      # runs here.
      - name: Marketing import boundary
        run: npm run check:marketing-boundary

      # A Supabase migration's version is the digits before the first
      # underscore, so two same-day files are ONE version and `db push` skips
      # the second. #285 and #286 collided this way.
      - name: Migration version uniqueness
        run: npm run check:migrations

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
